name: Live API Contract Tests

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  live-api:
    runs-on: ubuntu-latest
    # Only the main repository runs the weekly check; forks would repeat it and notify their owners
    if: github.repository == 'pr-omethe-us/PyKED'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group test
      - name: Run live API contract tests
        run: pytest -m live_api -v
